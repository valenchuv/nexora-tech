<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Carrito | NEXORA TECH</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 2.5rem;
      margin: 3rem 0 5rem 0;
    }
    .cart-table-wrap {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      padding: 1.5rem;
    }
    .cart-item {
      display: grid;
      grid-template-columns: 80px 1fr auto auto;
      align-items: center;
      gap: 1.5rem;
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--color-border);
    }
    .cart-summary {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      padding: 1.5rem;
      height: fit-content;
    }
    .summary-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.85rem;
      font-size: 0.95rem;
    }
    .summary-total {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--color-primary-dark);
      border-top: 2px solid var(--color-border);
      padding-top: 1rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-main">
      <div class="header-wrapper">
        <a href="index.html" class="logo-brand">
          <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></div>
          NEXORA<span>TECH</span>
        </a>
        <div class="header-actions">
          <a href="favoritos.html" class="action-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="action-badge" id="wishlistBadge">0</span></a>
          <a href="cuenta.html" class="action-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 style="font-size: 2rem; font-weight: 800; margin-top: 2.5rem; color: var(--color-primary-dark);">Carrito de Compras</h1>
    <div class="cart-layout" id="cartLayoutContainer"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
