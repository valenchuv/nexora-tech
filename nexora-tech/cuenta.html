<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cuenta DEMO | NEXORA TECH</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-main">
      <div class="header-wrapper">
        <a href="index.html" class="logo-brand">
          <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></div>
          NEXORA<span>TECH</span>
        </a>
        <div class="header-actions">
          <a href="favoritos.html" class="action-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="action-badge" id="wishlistBadge">0</span></a>
          <a href="carrito.html" class="action-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="action-badge" id="cartBadge">0</span></a>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="margin: 3.5rem auto 5rem auto;">
    <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--color-primary-dark); margin-bottom: 0.5rem;">Panel de Cuenta DEMO</h1>
    <p style="color: var(--color-text-muted); margin-bottom: 2.5rem;">Historial de pedidos y compras simuladas persistidas en tu navegador mediante localStorage.</p>

    <div id="ordersContainer"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const orders = JSON.parse(localStorage.getItem(STORAGE_KEYS.ORDERS) || "[]");
      const container = document.getElementById("ordersContainer");

      if (orders.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No tenés órdenes de compra registradas</h3>
            <p style="color: var(--color-text-muted); margin-bottom: 1.5rem;">Realizá una simulación completa de checkout para ver el registro histórico aquí.</p>
            <a href="productos.html" class="btn btn-primary">Ir a la tienda</a>
          </div>
        `;
        return;
      }

      const fmt = (v) => new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS" }).format(v);

      container.innerHTML = orders.map(ord => `
        <div style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 1.5rem; margin-bottom: 1.5rem;">
          <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--color-border); padding-bottom: 0.75rem; margin-bottom: 1rem;">
            <div>
              <strong style="color: var(--color-primary-blue); font-size: 1.05rem;">${ord.orderNumber}</strong>
              <div style="font-size: 0.8rem; color: var(--color-text-muted);">Fecha: ${ord.date}</div>
            </div>
            <div style="text-align: right;">
              <div style="font-weight: 800; font-size: 1.15rem; color: var(--color-primary-dark);">${fmt(ord.totals.total)}</div>
              <span style="font-size: 0.75rem; background: rgba(16,185,129,0.1); color: var(--color-success); padding: 2px 8px; border-radius: 9999px; font-weight: 700;">${ord.status}</span>
            </div>
          </div>
          <div style="font-size: 0.9rem;">
            <strong>Comprador:</strong> ${ord.customer.firstName} ${ord.customer.lastName} (${ord.customer.email}) &bull; 
            <strong>Pago:</strong> ${ord.payment.method} ${ord.payment.method === 'credit' ? `(${ord.payment.installments} cuotas)` : ''}
          </div>
        </div>
      `).join("");
    });
  </script>
</body>
</html>
