<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos | NEXORA TECH</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .catalog-layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 2rem;
      margin: 2.5rem 0 4rem 0;
    }
    .filter-group {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .filter-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-primary-dark);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .filter-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      font-size: 0.88rem;
    }
    .filter-item label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      color: var(--color-text-main);
    }
    .toolbar-catalog {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: var(--color-surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }
    .empty-state h3 {
      font-size: 1.3rem;
      color: var(--color-primary-dark);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-main">
      <div class="header-wrapper">
        <a href="index.html" class="logo-brand">
          <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></div>
          NEXORA<span>TECH</span>
        </a>
        <form class="header-search" id="globalSearchForm">
          <div class="search-input-group">
            <input type="text" id="globalSearchInput" placeholder="Buscar en el catálogo..." aria-label="Buscar">
            <button type="submit" class="search-submit-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
          </div>
        </form>
        <div class="header-actions">
          <a href="favoritos.html" class="action-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="action-badge" id="wishlistBadge">0</span></a>
          <a href="carrito.html" class="action-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="action-badge" id="cartBadge">0</span></a>
          <a href="cuenta.html" class="action-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="catalog-layout">
      <aside class="catalog-sidebar" id="sidebarFilters">
        <div class="filter-group">
          <div class="filter-title">
            <span>Categorías</span>
            <button class="btn-sm" style="color:var(--color-primary-blue);" onclick="resetFilter('category')">Limpiar</button>
          </div>
          <ul class="filter-list" id="categoryFilterList"></ul>
        </div>

        <div class="filter-group">
          <div class="filter-title">
            <span>Marcas</span>
            <button class="btn-sm" style="color:var(--color-primary-blue);" onclick="resetFilter('brand')">Limpiar</button>
          </div>
          <ul class="filter-list" id="brandFilterList"></ul>
        </div>

        <div class="filter-group">
          <div class="filter-title">Rango de Precio</div>
          <div style="display: flex; gap: 0.5rem; align-items: center;">
            <input type="number" id="minPrice" placeholder="Mín" style="width: 100%; padding: 0.4rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm);">
            <span>-</span>
            <input type="number" id="maxPrice" placeholder="Máx" style="width: 100%; padding: 0.4rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm);">
          </div>
          <button class="btn btn-primary btn-sm btn-block" style="margin-top: 0.75rem;" onclick="applyPriceFilter()">Filtrar precio</button>
        </div>
      </aside>

      <section class="catalog-content">
        <div class="toolbar-catalog">
          <div id="resultsCount">Cargando catálogo...</div>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <label for="sortSelect" style="font-size: 0.85rem; color: var(--color-text-muted);">Ordenar por:</label>
            <select id="sortSelect" style="padding: 0.4rem 0.8rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: #fff;">
              <option value="featured">Destacados</option>
              <option value="price-asc">Menor precio</option>
              <option value="price-desc">Mayor precio</option>
              <option value="rating">Mejor valorados</option>
              <option value="name-asc">A - Z</option>
            </select>
          </div>
        </div>

        <div class="products-grid" id="catalogGrid"></div>
      </section>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
