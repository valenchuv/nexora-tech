<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Favoritos | NEXORA TECH</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-main">
      <div class="header-wrapper">
        <a href="index.html" class="logo-brand">
          <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></div>
          NEXORA<span>TECH</span>
        </a>
        <div class="header-actions">
          <a href="carrito.html" class="action-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="action-badge" id="cartBadge">0</span></a>
          <a href="cuenta.html" class="action-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="margin: 3.5rem auto 5rem auto;">
    <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--color-primary-dark); margin-bottom: 2rem;">Mis Productos Favoritos</h1>
    <div class="products-grid" id="wishlistGrid"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderWishlist();
    });

    function renderWishlist() {
      const grid = document.getElementById("wishlistGrid");
      const wishlistIds = getWishlist();
      const products = PRODUCTS_DATA.filter(p => wishlistIds.includes(p.id));

      if (products.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: var(--color-text-light); margin-bottom: 1rem;">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <h3>Todavía no guardaste favoritos</h3>
            <p style="color: var(--color-text-muted); margin-bottom: 1.5rem;">Guardá los productos que más te interesen para revisarlos o comprarlos después.</p>
            <a href="productos.html" class="btn btn-primary">Explorar catálogo</a>
          </div>
        `;
        return;
      }

      grid.innerHTML = products.map(prod => `
        <div class="product-card">
          <button class="btn-wishlist active" onclick="removeWishlistItem('${prod.id}')" aria-label="Quitar de favoritos">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </button>
          <div class="product-image-wrap">
            <a href="producto.html?id=${prod.id}">
              <img src="${prod.images[0]}" alt="${prod.name}">
            </a>
          </div>
          <div class="product-details">
            <div class="product-category-brand">${prod.brand} &bull; ${prod.category}</div>
            <h3 class="product-name"><a href="producto.html?id=${prod.id}">${prod.name}</a></h3>
            <div class="product-price-box">
              <div class="current-price">${formatPrice(prod.price)}</div>
            </div>
            <div class="product-actions">
              <button class="btn btn-primary btn-sm btn-block" onclick="addToCart('${prod.id}')">Agregar al carrito</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    function removeWishlistItem(id) {
      toggleWishlist(id);
      renderWishlist();
    }
  </script>
</body>
</html>
