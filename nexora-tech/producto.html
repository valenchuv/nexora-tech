<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de Producto | NEXORA TECH</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 3.5rem;
      margin: 3rem 0;
      background: var(--color-surface);
      padding: 2.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
    }
    .main-img-box {
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .main-img-box img {
      max-height: 90%;
      max-width: 90%;
      object-fit: contain;
    }
    .thumb-strip {
      display: flex;
      gap: 0.75rem;
    }
    .thumb-item {
      width: 75px;
      height: 75px;
      border: 2px solid var(--color-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      overflow: hidden;
      background: #F8FAFC;
    }
    .thumb-item.active {
      border-color: var(--color-primary-blue);
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .tabs-nav {
      display: flex;
      gap: 2rem;
      border-bottom: 2px solid var(--color-border);
      margin-top: 3rem;
    }
    .tab-btn {
      padding: 0.8rem 0;
      font-weight: 700;
      color: var(--color-text-muted);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      cursor: pointer;
    }
    .tab-btn.active {
      color: var(--color-primary-blue);
      border-color: var(--color-primary-blue);
    }
    .tab-content {
      display: none;
      padding: 2rem 0;
    }
    .tab-content.active {
      display: block;
    }
    .specs-table {
      width: 100%;
      border-collapse: collapse;
    }
    .specs-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--color-border);
    }
    .specs-table td:first-child {
      font-weight: 600;
      width: 30%;
      color: var(--color-primary-dark);
      background: #F8FAFC;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-main">
      <div class="header-wrapper">
        <a href="index.html" class="logo-brand">
          <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></div>
          NEXORA<span>TECH</span>
        </a>
        <form class="header-search" id="globalSearchForm">
          <div class="search-input-group">
            <input type="text" id="globalSearchInput" placeholder="Buscar productos..." aria-label="Buscar">
            <button type="submit" class="search-submit-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
          </div>
        </form>
        <div class="header-actions">
          <a href="favoritos.html" class="action-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="action-badge" id="wishlistBadge">0</span></a>
          <a href="carrito.html" class="action-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="action-badge" id="cartBadge">0</span></a>
          <a href="cuenta.html" class="action-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
        </div>
      </div>
    </div>
  </header>

  <main class="container" id="productDetailContainer"></main>

  <div class="container">
    <section class="section-padding">
      <h2 class="section-title">También te puede interesar</h2>
      <div class="products-grid" id="relatedProductsGrid" style="margin-top: 1.5rem;"></div>
    </section>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/product-detail.js"></script>
</body>
</html>
